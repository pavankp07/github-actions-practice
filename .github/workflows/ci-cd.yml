
name: GitHub Actions Practice

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build application
        run: echo "Building application..."

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Run tests
        run: echo "Tests passed!"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy application
        run: echo "Deployment successful!"

  practice:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      APP_NAME: github-actions-practice
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display environment variable
        run: echo "Application name is $APP_NAME"

      - name: Check secret is configured
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Demo secret is configured successfully!"
          else
            echo "Demo secret is missing!"
            exit 1
          fi

      - name: Run only on main branch
        if: github.ref == 'refs/heads/main'
        run: echo "This step runs only on the main branch!"
  
  matrix-practice:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        number: [1, 2, 3]

    steps:
      - name: Display matrix value
        run: echo "Running matrix job number ${{ matrix.number }}"
  call-reusable-workflow:
    uses: ./.github/workflows/reusable-build.yml

  artifact-practice:
    runs-on: ubuntu-latest
    steps:
      - name: Create demo file
        run: echo "Hello from GitHub Actions!" > demo.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-demo-artifact
          path: demo.txt

  artifact-download-practice:
    needs: artifact-practice
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: my-demo-artifact

      - name: Display downloaded file
        run: cat demo.txt
