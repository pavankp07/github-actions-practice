
name: My First GitHub Actions Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  practice:
    runs-on: ubuntu-latest
    env:
      APP_NAME: github-actions-practice

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print a message
        run: echo "Hello! My first GitHub Actions workflow is running!"

      - name: Display environment variable
        run: echo "Application name is $APP_NAME"

      - name: Check secret is configured
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Demo secret is configured successfully!"
          else
            echo "Demo secret is missing!"
            exit 1
          fi

      - name: Check Linux version
        run: uname -a
