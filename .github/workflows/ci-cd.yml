
name: GitHub Actions Practice

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build application
        run: echo "Building application..."

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Run tests
        run: echo "Tests passed!"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy application
        run: echo "Deployment successful!"

  practice:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      APP_NAME: github-actions-practice
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display environment variable
        run: echo "Application name is $APP_NAME"

      - name: Check secret is configured
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Demo secret is configured successfully!"
          else
            echo "Demo secret is missing!"
            exit 1
          fi
